# =============================================
# APPLICATION
# =============================================
spring.application.name=digital-parcel-repository
server.port=8080

# =============================================
# MYSQL DATABASE CONNECTION
# =============================================
# Make sure you create this database in MySQL first:
#   CREATE DATABASE digital_parcel_db;
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/digital_parcel_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:#Leon002}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# JPA / HIBERNATE
# =============================================
# ddl-auto options:
#   create       - drops and recreates tables every restart (use during early development)
#   update       - updates schema without dropping data (use once you have real data)
#   validate     - only validates schema, never changes it (use in production)
#   none         - does nothing (use in production with manual migrations)
spring.jpa.hibernate.ddl-auto=update

# Shows the actual SQL queries Hibernate runs - very useful for learning
spring.jpa.show-sql=true

# Formats the SQL output so it's readable
spring.jpa.properties.hibernate.format_sql=true

# Tells Hibernate which SQL dialect to use (MySQL 8 syntax)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =============================================
# JWT CONFIGURATION
# =============================================
# Secret key used to sign JWT tokens - must be long and random in production
# This is just a placeholder - we will use this in Phase 9
app.jwt.secret=${JWT_SECRET:digitalparcel_super_secret_key_change_this_in_production_must_be_long}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
