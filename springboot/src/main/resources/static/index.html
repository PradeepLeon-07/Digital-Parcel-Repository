<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Parcel Repository</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN PAGE -->
<div id="loginPage" class="page">
    <div class="login-box">
        <h1>📦 Digital Parcel Repository</h1>
        <p class="subtitle">College Parcel Management System</p>
        <div id="loginError" class="error-msg hidden"></div>
        <input type="text" id="username" placeholder="Username" />
        <input type="password" id="password" placeholder="Password" />
        <button onclick="login()">Login</button>
    </div>
</div>

<!-- MAIN APP -->
<div id="appPage" class="page hidden">

    <!-- NAVBAR -->
    <nav>
        <span>📦 Digital Parcel Repository</span>
        <div class="nav-right">
            <span id="navUser"></span>
            <button class="btn-small" onclick="logout()">Logout</button>
        </div>
    </nav>

    <!-- TAB BUTTONS -->
    <div id="tabBar" class="tab-bar"></div>

    <!-- TAB CONTENT -->
    <div class="container">

        <!-- DASHBOARD TAB -->
        <div id="tab-dashboard" class="tab-content">
            <h2>Dashboard</h2>
            <div class="cards" id="dashboardCards"></div>
        </div>

        <!-- ALL PARCELS TAB -->
        <div id="tab-parcels" class="tab-content hidden">
            <h2>All Parcels</h2>
            <div class="search-bar">
                <input type="text" id="searchParcelId" placeholder="Search by Parcel ID" />
                <button onclick="searchParcel()">Search</button>
                <select id="filterStatus" onchange="filterByStatus()">
                    <option value="">All Statuses</option>
                    <option value="RECEIVED">Received</option>
                    <option value="READY_FOR_COLLECTION">Ready for Collection</option>
                    <option value="COLLECTED">Collected</option>
                </select>
                <button onclick="loadParcels()">Reset</button>
            </div>
            <div id="parcelsTable"></div>
        </div>

        <!-- ADD PARCEL TAB -->
        <div id="tab-addParcel" class="tab-content hidden">
            <h2>Add New Parcel</h2>
            <div id="addParcelMsg" class="hidden"></div>
            <div class="form-box">
                <input type="text" id="newParcelId" placeholder="Parcel ID (e.g. PCL-2024-001)" />
                <input type="text" id="newRegisterNumber" placeholder="Student Register Number" />
                <input type="text" id="newCourierName" placeholder="Courier Name" />
                <input type="text" id="newSenderName" placeholder="Sender Name (optional)" />
                <input type="date" id="newReceivedDate" />
                <input type="text" id="newStorageLocation" placeholder="Storage Location (e.g. Rack-A-3)" />
                <button onclick="addParcel()">Add Parcel</button>
            </div>
        </div>

        <!-- STUDENTS TAB -->
        <div id="tab-students" class="tab-content hidden">
            <h2>Students</h2>
            <div class="search-bar">
                <input type="text" id="searchRegNum" placeholder="Search by Register Number" />
                <button onclick="searchStudent()">Search</button>
                <button onclick="loadStudents()">Show All</button>
            </div>
            <div id="studentsTable"></div>
        </div>

        <!-- ADD STUDENT TAB -->
        <div id="tab-addStudent" class="tab-content hidden">
            <h2>Add New Student</h2>
            <div id="addStudentMsg" class="hidden"></div>
            <div class="form-box">
                <input type="text" id="sRegisterNumber" placeholder="Register Number" />
                <input type="text" id="sName" placeholder="Full Name" />
                <input type="text" id="sDepartment" placeholder="Department" />
                <input type="number" id="sYear" placeholder="Year (1-5)" min="1" max="5" />
                <input type="text" id="sPhone" placeholder="Phone Number" />
                <input type="email" id="sEmail" placeholder="Email" />
                <input type="password" id="sPassword" placeholder="Login Password" />
                <button onclick="addStudent()">Add Student</button>
            </div>
        </div>

        <!-- MY PARCELS TAB (student only) -->
        <div id="tab-myParcels" class="tab-content hidden">
            <h2>My Parcels</h2>
            <div id="myParcelsTable"></div>
        </div>

    </div>
</div>

<script src="app.js"></script>
</body>
</html>
